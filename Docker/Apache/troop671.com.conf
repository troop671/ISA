<VirtualHost *:80>
  ServerName www.troop671.com
  ServerAlias troop671.com localhost
  DocumentRoot /home/dh_vpjbmy/troop671.com
  ErrorLog /proc/self/fd/2
  CustomLog /proc/self/fd/1 combined
  DirectoryIndex index.html index.php
  <Directory /home/dh_vpjbmy/troop671.com>
    Options +ExecCGI +FollowSymLinks
    AllowOverride All
    Require all granted
    AddHandler fcgid-script .php
    FcgidWrapper /usr/local/bin/php83-cgi .php
  </Directory>
</VirtualHost>
